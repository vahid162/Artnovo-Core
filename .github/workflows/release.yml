name: Publish release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the versioned ZIP after owner authorization'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: artnovo-core-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    uses: ./.github/workflows/validate.yml
  publish:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build runtime package
        id: package
        run: |
          python3 tools/package.py > "$RUNNER_TEMP/artnovo-release.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'artnovo-release.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('tag', 'version', 'archive'):
                  output.write(f'{key}={data[key]}\n')
          print(json.dumps(data))
          PY
      - name: Publish versioned ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
          RELEASE_CONFIRMED: ${{ inputs.publish }}
        run: |
          if [[ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" || "${GITHUB_REF:-}" != "refs/heads/main" || "${RELEASE_CONFIRMED:-}" != "true" ]]; then
            echo "::error::Publish requires a confirmed manual run on main."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > "$RUNNER_TEMP/artnovo-existing-release.json" 2>/dev/null; then
            python3 - <<'PY'
          import json, os, subprocess, tempfile
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'artnovo-existing-release.json').read_text())
          archive = Path(os.environ['RELEASE_ARCHIVE'])
          required = {archive.name, 'SHA256SUMS'}
          assets = {asset['name'] for asset in data.get('assets', []) if asset.get('size', 0) > 0}
          if data.get('isDraft') is not False or not required.issubset(assets):
              raise SystemExit('::error::Existing release is a draft or lacks the non-empty versioned ZIP/checksum. Inspect it before publishing.')
          with tempfile.TemporaryDirectory(prefix='artnovo-published-', dir=os.environ['RUNNER_TEMP']) as directory:
              try:
                  subprocess.run([
                      'gh', 'release', 'download', os.environ['RELEASE_TAG'],
                      '--repo', os.environ['GITHUB_REPOSITORY'],
                      '--pattern', archive.name, '--pattern', 'SHA256SUMS', '--dir', directory,
                  ], check=True)
                  for candidate in (archive, archive.with_name('SHA256SUMS')):
                      published = Path(directory) / candidate.name
                      if not published.is_file() or published.read_bytes() != candidate.read_bytes():
                          raise SystemExit('::error::Existing release assets differ from the candidate package. Inspect the release and use a new version; published assets were left intact.')
              except (OSError, subprocess.CalledProcessError):
                  raise SystemExit('::error::Could not verify existing release assets. Inspect the release before publishing; its tag and assets were left intact.')
          PY
            echo "::notice::Release $RELEASE_TAG matches the candidate package; its tag and assets were left intact."
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists without a release. Inspect its target before publishing."
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$RELEASE_ARCHIVE" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Artnovo Core $RELEASE_VERSION" --notes-file CHANGELOG.md --latest
