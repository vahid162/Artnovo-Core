<!doctype html>
<html lang="fa" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>صفحه پیدا نشد | آرت‌نوو</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; background: #0c1723; color: #f0f9f7; font: 16px/1.75 Tahoma, Arial, sans-serif; }
		header { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 6px; padding: 6px clamp(12px,5vw,42px); border-bottom: 1px solid #2c4451; }
		header strong { font-size: 17px; white-space: nowrap; }
		header a { display: inline-flex; align-items: center; min-height: 44px; color: #9adaf0; font-size: 13px; text-decoration: none; }
		header a:last-child { justify-self: end; }
		main { display: grid; justify-items: center; gap: 10px; max-width: 460px; margin: clamp(24px,8vw,90px) auto; padding: clamp(20px,5vw,35px); border: 1px solid #2c4451; border-radius: 15px; background: #152735; text-align: center; }
		h1, p { margin: 0; }
		h1 { font-size: clamp(22px,5vw,28px); }
		p { color: #bdd1d0; }
		.code { color: #46d7a6; font-size: 42px; font-weight: 700; line-height: 1.25; }
		main a { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; width: min(100%, 280px); margin-top: 4px; padding: 6px 12px; border-radius: 9px; background: #46d7a6; color: #06261b; font-size: 14px; font-weight: 700; text-decoration: none; }
		main a:hover { background: #69e1b7; }
		a:focus-visible { outline: 2px solid #9adaf0; outline-offset: 3px; }
		@media (max-width: 500px) { main { margin-inline: 12px; } }
	</style>
</head>
<body data-artnovo-edge-404>
	<header aria-label="آرت‌نوو">
		<a href="/#artnovo-categories">خرید اشتراک</a>
		<strong>آرت‌نوو</strong>
		<a href="/my-account/">حساب من</a>
	</header>
	<main>
		<span class="code" aria-hidden="true">۴۰۴</span>
		<h1>صفحه پیدا نشد</h1>
		<p>برای مشاهدهٔ پلن‌ها به صفحهٔ خرید برگردید.</p>
		<a href="/#artnovo-categories">بازگشت به خرید اشتراک</a>
	</main>
</body>
</html>
